[tool:pytest]
DJANGO_SETTINGS_MODULE = lms.envs.test
testpaths = iterativexblock
addopts = --nomigrations --reuse-db --durations=20 --json-report --json-report-omit keywords streams collectors log traceback tests --json-report-file=none --cov=iterativexblock/ --cov-report term-missing --cov-report xml:reports/coverage/coverage.xml --cov-fail-under 85
# Enable default handling for all warnings, including those that are ignored by default;
# but hide rate-limit warnings (because we deliberately don't throttle test user logins),
# field_data deprecation warnings (because fixing them requires a major low-priority refactoring),
# and deprecation warnings raised by third-party deps and edx-platform code we don't import
# ourselves and can't fix from this package (defusedxml, PyContracts/numpy, newrelic,
# django-wiki/course_wiki's `etree` usage) — see SUPPRESSED_WARNINGS.md
filterwarnings =
    default
    ignore:No request passed to the backend, unable to rate-limit:UserWarning
    ignore::xblock.exceptions.FieldDataDeprecationWarning
    ignore:defusedxml.cElementTree is deprecated.*:DeprecationWarning
    ignore:defusedxml.lxml is no longer supported.*:DeprecationWarning
    ignore:the imp module is deprecated in favour of importlib.*:DeprecationWarning
    ignore:`np\.(int|float|complex)` is a deprecated alias.*:DeprecationWarning
    ignore:Using or importing the ABCs from 'collections' instead of from 'collections.abc' is deprecated.*:DeprecationWarning
    ignore:`formatargspec` is deprecated since Python 3.5.*:DeprecationWarning
    ignore:'etree' is deprecated. Use 'xml.etree.ElementTree' instead.*:DeprecationWarning
junit_family = xunit2
norecursedirs = .* *.egg build conf dist node_modules test_root wf_tmp
python_classes =
python_files = tests.py

[coverage:run]
omit =
    */migrations/*
